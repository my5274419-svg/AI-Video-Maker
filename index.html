<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Creator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #1e1e1e; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); text-align: center; width: 90%; max-width: 500px; }
        h1 { color: #00ffcc; margin-bottom: 10px; }
        p { color: #aaaaaa; margin-bottom: 20px; }
        .upload-section { margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .upload-btn { background-color: #333333; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; border: 1px solid #555; transition: 0.3s; display: inline-block; }
        .upload-btn:hover { background-color: #00ffcc; color: #121212; border-color: #00ffcc; }
        #fileName { margin-top: 10px; font-size: 14px; color: #888; margin-bottom: 20px; }
        #motionPrompt { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #555; background-color: #2a2a2a; color: white; font-size: 14px; }
        #motionPrompt:focus { outline: none; border-color: #00ffcc; }
        #generateBtn { background-color: #00ffcc; color: #121212; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.3s; }
        #generateBtn:hover { background-color: #00cca3; }
        .hidden { display: none; }
        #loading, #videoContainer { margin-top: 30px; padding: 15px; background-color: #2a2a2a; border-radius: 8px; }
        #outputVideo { margin-top: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Video Creator</h1>
        <p>Image aur Prompt se video banayein</p>
        
        <div class="upload-section">
            <input type="file" id="imageInput" accept="image/*">
            <label for="imageInput" class="upload-btn">Select Image</label>
            <p id="fileName">Koi image select nahi ki</p>
        </div>

        <div class="prompt-section">
            <input type="text" id="motionPrompt" placeholder="Motion Prompt likhein (jaise: Cinematic, Zoom in...)">
        </div>

        <button id="generateBtn">Generate Video</button>

        <div id="loading" class="hidden">
            <p>Processing AI Video... Isme 1-2 minute lag sakte hain...</p>
        </div>

        <div id="videoContainer" class="hidden">
            <h3>Your Video is Ready!</h3>
            <video id="outputVideo" controls width="100%"></video>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const fileNameDisplay = document.getElementById('fileName');
        const generateBtn = document.getElementById('generateBtn');
        const loadingDiv = document.getElementById('loading');
        const videoContainer = document.getElementById('videoContainer');
        const outputVideo = document.getElementById('outputVideo');
        
        const API_KEY = "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"; 

        imageInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileNameDisplay.textContent = this.files[0].name;
            } else {
                fileNameDisplay.textContent = "Koi image select nahi ki";
            }
        });

        generateBtn.addEventListener('click', async function() {
            if (!imageInput.files[0]) {
                alert("Bhai, pehle ek image toh select karo!");
                return;
            }

            generateBtn.style.display = "none";
            loadingDiv.classList.remove('hidden');
            videoContainer.classList.add('hidden');

            try {
                const imageFile = imageInput.files[0];
                
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/stabilityai/stable-video-diffusion-img2vid-xt",
                    {
                        headers: { 
                            Authorization: `Bearer ${API_KEY}`
                        },
                        method: "POST",
                        body: imageFile, 
                    }
                );

                if (!response.ok) {
                    throw new Error("AI Server abhi busy hai. Kripya 1 minute baad dobara try karein!");
                }

                const videoBlob = await response.blob();
                const videoUrl = URL.createObjectURL(videoBlob);
                
                outputVideo.src = videoUrl;
                
                loadingDiv.classList.add('hidden');
                videoContainer.classList.remove('hidden');
                generateBtn.style.display = "block";

            } catch (error) {
                alert(error.message);
                loadingDiv.classList.add('hidden');
                generateBtn.style.display = "block";
            }
        });
    </script>
</body>
</html>
